name: 基座自检

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备隐私模式文件
        # 钩子 fail-closed：模式文件缺失会阻断提交，CI 里用示例即可
        run: |
          cp templates/privacy-patterns.example .privacy-patterns
          chmod 600 .privacy-patterns

      - name: Shell 语法检查
        run: |
          for f in templates/*.sh; do
            bash -n "$f" || { echo "语法错误: $f"; exit 1; }
          done

      - name: 隐私防护行为测试
        run: bash templates/privacy.test.sh

      - name: 技能清单完整性（仅报告，不阻断）
        # 只报告不阻断：技能装在各人自己的环境里（~/.config/opencode/skills），
        # GitHub runner 上必然一个都没有，MISSING=16、退出码 1。
        # 这是 runner 的环境属性，不是 PR 的问题 —— 用阻断会让每个 PR
        # 都挂在这条与改动无关的检查上。真正该阻断的是上面两项隐私检查
        # 与下面的「.privacy-patterns 未入库」。
        run: bash templates/skills-check.sh --check || true

      - name: 历史隐私体检
        run: bash templates/history-scan.sh

      - name: 文档一致性
        run: |
          # 1. 相对链接不得断链
          fail=0
          for f in $(find . -name '*.md' -not -path './.git/*'); do
            d=$(dirname "$f")
            while read -r l; do
              [ -f "$d/$l" ] || { echo "断链: $f -> $l"; fail=1; }
            done < <(grep -oE '\]\([A-Za-z0-9_./-]+\.md\)' "$f" 2>/dev/null \
                     | sed 's/](//;s/)$//' | sort -u)
          done
          [ $fail -eq 0 ] || exit 1
          echo "相对链接全部可达"

          # 2. 文档命名约定不得漂移
          # 阶段号位置：统一 <project>-p<阶段>-<作用>.md，旧式把阶段号放
          # 尾巴的写法（implementation-plan- 开头）已废弃。
          # 占位符：阶段占位符统一用中文写法，英文拼法已废弃 —— 它还会
          # 顺着脚本名一起漂移（e2e_pSTAGE.sh），故一并拦截。
          # 模式写成 [p]/[S] 而非 p/S —— 否则这条断言会匹配到它自己所在的那行。
          bad=0
          while IFS= read -r hit; do
            echo "::error::命名约定漂移: $hit"
            bad=1
          done < <(git grep -nE 'implementation-plan-[p]<|<[p]hase>|[p]STAGE|<[S]TAGE>' -- '*.md' '*.sh' || true)
          [ $bad -eq 0 ] || exit 1
          echo "命名约定无漂移"

      - name: .privacy-patterns 未入库
        run: |
          if git ls-files | grep -qE '\.privacy-patterns$'; then
            echo "::error::.privacy-patterns 被提交入库了，它必须保持不入库"
            exit 1
          fi
          echo "OK: .privacy-patterns 未入库"